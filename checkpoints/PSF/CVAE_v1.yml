name: PSF_CVAE
model_type: CVAE_PSF_model  # Must match class name exactly
is_train: true
report_to: comet_ml
push_to_hub: false
num_gpu: 1  # Start with 1 GPU for initial testing
seed: 42
mixed_precision: !!str no  # Disable mixed precision for stability
allow_tf32: false
tracker_project_name: PSF_CVAE
experiment_key: CVAE_PSF_GridSampling_v1

# 4D Grid sampling configuration (x, y, z, f)
# Spatial field grid (x, y) - increased resolution
grid_size_xy: 100  # 100x100 spatial grid cells

# Depth and focus grids
grid_size_z: 50    # 50 object depth steps
grid_size_f: 50    # 50 focus distance steps

# Physical ranges for smartphone-scale optics (meters)
z_min: !!float 0.1   # Minimum object depth (0.1m = 10cm, macro range)
z_max: !!float 3.0   # Maximum object depth (3.0m, far field)
f_min: !!float 0.1   # Minimum focus distance (0.1m)
f_max: !!float 3.0   # Maximum focus distance (3.0m)

# Stratified sampling with jitter
use_jitter: true           # Enable jittered sampling (recommended)
samples_per_batch: 256     # Number of 4D samples per training batch

# PSF kernel configuration
kernel_size_small: 100  # PSF kernel size (100x100)

# DeepLens raytracing configuration (inherited from PSF_model)
deeplens:
  lens_file: "/depot/chan129/users/harshana/svd_v2/lenses/thorlabs/acl12708u.json"
  single_wavelength: false
  spp: 100000  # Samples per pixel for ray tracing
  kernel_size: 100  # Full resolution PSF (100x100)

  wavelength_set_m: [!!float 450e-9, !!float 550e-9, !!float 650e-9]  # B G R

  fov: !!float 0.015  # Field of view in meters (approx smartphone sensor)

  # Depth range for DeepLens raytracing (smartphone-scale)
  # Note: These are used by the legacy foc_z_arr; new 4D sampling uses z_min/z_max above
  depth_min: !!float 100e-3   # Minimum depth: 0.1m (100mm) - macro range
  depth_max: !!float 3000e-3  # Maximum depth: 3.0m (3000mm) - far field

# Dataset configuration (using DummyDataset for on-the-fly generation)
datasets:
  train:
    type: DummyDataset
    size: 2000  # Number of iterations per epoch
    use_shuffle: true

  val:
    type: DummyDataset
    size: 50  # Validation iterations
    use_shuffle: false

# CVAE Network Architecture
network:
  type: CVAE_PSF  # Matches CVAE_PSF_config/CVAE_PSF_arch
  kernel_size: 100  # PSF kernel size (100x100)
  in_channels: 3  # RGB channels
  latent_dim: 128  # Latent space dimension
  hidden_dim: 512  # Hidden layer width in MLPs
  num_layers: 4  # Number of layers in each MLP
  num_frequencies: 10  # Positional encoding frequency bands (L=10)
  activation: relu  # Activation function
  coord_dim: 4  # 4D coordinates: (x, y, z, f)

# Paths
path:
  root: /scratch/gilbreth/tang843/experiments  # Experiment output directory
  logging_dir: logs
  resume_from_path: null  # Set to checkpoint path if resuming
  resume_from_checkpoint: null  # 'latest' or specific checkpoint

# Training settings
train:
  # Loss component toggles (for ablation studies)
  use_l1_loss: false          # Enable L1 loss in reconstruction (preserves sharp features)
  use_gradient_loss: false    # Enable gradient loss in reconstruction (preserves shapes)
  use_smooth_loss: false      # Enable spatial smoothness regularization on prior
  use_free_bits: false        # Enable free bits technique (prevents posterior collapse)

  # Loss weights (only used if corresponding component is enabled)
  recon_weight: !!float 1.0   # Reconstruction loss weight (always MSE, optionally + L1 + Gradient)
  kl_weight: !!float 1e-4     # KL divergence weight (set back to original, adjust if using free_bits)
  smooth_weight: !!float 1e-3 # Smoothness regularization weight (only if use_smooth_loss=true)
  l1_weight: !!float 0.5      # L1 loss weight in reconstruction (only if use_l1_loss=true)
  grad_weight: !!float 0.1    # Gradient loss weight in reconstruction (only if use_gradient_loss=true)
  free_bits: !!float 0.5      # Minimum KL per latent dimension (only if use_free_bits=true)

  # Optimizer configuration
  optim:
    scale_lr: false
    use_8bit_adam: false
    learning_rate: !!float 1e-4  # Initial learning rate
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: !!float 1e-8
    max_grad_norm: 1.0

  # Learning rate scheduler
  scheduler:
    type: cosine_with_restarts
    lr_warmup_steps: 500  # Warmup steps
    lr_num_cycles: 3  # Number of cosine cycles
    lr_power: 1.0

  loss: 1*MSE  # Base loss type (used in parent class, actual loss is custom)
  gradient_accumulation_steps: 1
  num_train_epochs: 50
  batch_size: 64  # Batch size (sampled from grid)

  max_train_steps: 100000  # Maximum training steps
  validation_steps: 500  # Validation frequency
  checkpointing_steps: 1000  # Checkpoint save frequency
  checkpoints_total_limit: 3  # Keep only last N checkpoints

  patched: false  # No patching needed for PSF
  check_speed: false  # Disable profiling

# Validation settings
val:
  save_images: true  # Save validation images
  batch_size: 64  # Validation batch size
  max_val_steps: 10  # Limit validation steps

  metrics:
    psnr:
      crop: 0
    mse:
      crop: 0
